<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/></marker></defs>
<rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
<text x="490.0" y="30" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#1a202c">forecast-skill-vs-mix: where the answer comes from</text>
<rect x="40" y="60" width="190" height="70" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.4" rx="6"/>
<text x="135.0" y="91.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1a202c">weekly demand panel</text>
<text x="135.0" y="107.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">sku, week, actual, forecast</text>
<rect x="40" y="170" width="190" height="70" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.4" rx="6"/>
<text x="135.0" y="201.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1a202c">seeded generator</text>
<text x="135.0" y="217.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">planted ground truth</text>
<line x1="135" y1="170" x2="135" y2="134" stroke="#4a5568" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="230" y1="95" x2="300" y2="95" stroke="#4a5568" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="300" y="60" width="210" height="80" fill="#ffffff" stroke="#4a5568" stroke-width="1.6" rx="6"/>
<text x="405.0" y="88.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1a202c">validate and aggregate</text>
<text x="405.0" y="104.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">to two period totals</text>
<text x="405.0" y="120.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">ADR-003</text>
<line x1="405" y1="140" x2="405" y2="185" stroke="#4a5568" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="300" y="185" width="210" height="105" fill="#fff8e6" stroke="#b7791f" stroke-width="1.8" rx="6"/>
<text x="405.0" y="217.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1a202c">split into four populations</text>
<text x="405.0" y="233.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">decomposable / entrants</text>
<text x="405.0" y="249.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">exits / dormant</text>
<text x="405.0" y="265.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">only the first is defined</text>
<line x1="510" y1="100" x2="600" y2="100" stroke="#4a5568" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="600" y="60" width="180" height="80" fill="#ffffff" stroke="#4a5568" stroke-width="1.6" rx="6"/>
<text x="690.0" y="88.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1a202c">seasonal naive referee</text>
<text x="690.0" y="104.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">week aligned</text>
<text x="690.0" y="120.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">ADR-004</text>
<line x1="510" y1="235" x2="600" y2="235" stroke="#4a5568" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="600" y="185" width="340" height="105" fill="#fff8e6" stroke="#b7791f" stroke-width="1.8" rx="6"/>
<text x="770.0" y="217.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1a202c">decompose in four conventions</text>
<text x="770.0" y="233.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">skill, mix, interaction</text>
<text x="770.0" y="249.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">they disagree: the spread is</text>
<text x="770.0" y="265.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">published, not hidden.  ADR-002</text>
<line x1="770" y1="290" x2="770" y2="330" stroke="#4a5568" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="600" y="330" width="340" height="75" fill="#ffffff" stroke="#4a5568" stroke-width="1.6" rx="6"/>
<text x="770.0" y="363.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1a202c">bootstrap the skill effect over SKUs</text>
<text x="770.0" y="379.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">an interval that covers zero is not an effect</text>
<line x1="405" y1="290" x2="405" y2="440" stroke="#4a5568" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="600" y1="370" x2="500" y2="440" stroke="#4a5568" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="260" y="440" width="290" height="80" fill="#fff8e6" stroke="#b7791f" stroke-width="1.8" rx="6"/>
<text x="405.0" y="468.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1a202c">verdict</text>
<text x="405.0" y="484.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">0 attributed  ·  1 answered no</text>
<text x="405.0" y="500.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">2 cannot answer  ·  3 usage</text>
<rect x="600" y="440" width="340" height="80" fill="#fff8e6" stroke="#b7791f" stroke-width="1.8" rx="6"/>
<text x="770.0" y="468.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1a202c">unattributable remainder, always reported</text>
<text x="770.0" y="484.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">entrants and exits have no counterfactual</text>
<text x="770.0" y="500.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a5568">ADR-005 states what the fixture cannot show</text>
<line x1="550" y1="480" x2="596" y2="480" stroke="#4a5568" stroke-width="1.5" marker-end="url(#head)"/>
</svg>
