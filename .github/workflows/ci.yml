name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests experiments tools
          ruff format --check src tests experiments tools

      # Its own step, deliberately. A red test surfacing as a CalledProcessError
      # traceback out of the metrics collector costs an hour to attribute.
      - name: Tests
        run: |
          python -m pytest tests/ -q \
            --junitxml=junit.xml \
            --cov=fsvm --cov-report=json --cov-report=xml --cov-report=term

      - name: Coverage floor
        run: |
          python - <<'PY'
          import json, sys
          covered = json.load(open("coverage.json"))["totals"]["percent_covered"]
          floor = 95.0
          print(f"line coverage {covered:.2f}%, floor {floor}%")
          sys.exit(0 if covered >= floor else 1)
          PY

      - name: Experiments
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/experiments
        run: |
          for experiment in experiments/exp*.py; do
            echo "== $experiment"
            python "$experiment"
          done

      - name: Receipts
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/experiments
        run: |
          python tools/collect_metrics.py --skip-tests --skip-experiments
          python tools/check_numbers.py --summary receipts-summary.md

      - name: Publish the awkward table
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          {
            echo "## Where the improvement came from"
            echo
            echo '```'
            python -m fsvm.cli attribute \
              --panel data/fixtures/panel-realistic.csv --bootstrap 2000 || true
            echo '```'
            echo
            echo "## Does it beat a referee nobody tuned"
            echo
            echo '```'
            python -m fsvm.cli referee --panel data/fixtures/panel-realistic.csv || true
            echo '```'
            if [ -f receipts-summary.md ]; then cat receipts-summary.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload experiment output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiments-py${{ matrix.python-version }}
          path: |
            docs/experiments/*.json
            docs/metrics.json
            junit.xml
          if-no-files-found: error

  committed-artifacts:
    name: Diagram and evidence are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Re-render the diagram and check for drift
        run: |
          python tools/render_diagram.py
          git diff --exit-code docs/img/architecture.svg
      # The console SVGs are published evidence. Without this gate they can go
      # stale silently while the numbers they show move, which an audit found.
      - name: Re-capture the console evidence and check for drift
        run: |
          python tools/capture_evidence.py
          git diff --exit-code docs/img/console-attribute.svg docs/img/console-referee.svg
      - name: Regenerate the fixture and check it is byte identical
        run: |
          python -m fsvm.cli generate \
            --out data/fixtures/panel-realistic.csv --scenario realistic
          git diff --exit-code data/fixtures/panel-realistic.csv
